<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermosa Bites</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="navbar">
            <div class="logo">
                <img src="hermosabites.png" alt="Hermosa Bites Logo">
            </div>
            <div class="search-container">
                <input type="text" placeholder="Search for cakes..." class="search-input">
                <button type="submit" class="search-button">Search</button>
            </div>

            <div class="user-menu">
                <ul>
                    <li><a href="index.html"><img src="home.svg" alt=""><br>Home</a></li>
                    <li><a href="menu.html"><img src="Menu.png" alt=""><br>Menu</a></li>
                    <li><a href="order.html"><img src="Order.png" alt=""><br>Order</a></li>
                    <li><a href="contact.html"><img src="contact.png" alt=""><br>Contact Us</a></li>

                    <button id="loginBtn" class="button">Login</button><br>
                    <button id="signupBtn" class="button">Sign Up</button>


                    <!-- Sign-up Modal -->
                    <div id="signupModal" class="modal">
                        <div class="modal-content">
                            <span class="close">&times;</span>
                            <h2>Sign Up</h2>
                            <form>
                                <label for="signup-username">Username:</label>
                                <input type="text" id="signup-username" name="username" required><br><br>
                                <label for="email">Email:</label>
                                <input type="email" id="signup-email" name="email" required><br><br>
                                <label for="signup-password">Password:</label>
                                <input type="password" id="signup-password" name="password" required><br><br>
                                <input type="submit" value="Sign Up">
                            </form>
                        </div>
                    </div>

                </ul>
            </div>

            <!-- Login Modal -->
            <div id="loginModal" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Login</h2>
                    <form>
                        <label for="login-username">Username:</label>
                        <input type="text" id="login-username" name="username" required><br><br>
                        <label for="password">Password:</label>
                        <input type="password" id="login-password" name="password" required><br><br>
                        <input type="submit" value="Login">
                    </form>
                </div>
            </div>

        </div>
    </header>



    <section class="cake-categories">
        <h1>Welcome to Hermosa Bites</h1>
        <p>Upto 40% Off on Delicious Cakes | Free Delivery</p>
        <div class="categories">
            <div class="category">
                <img src="birthday.jpeg" alt="Birthday Cakes">
                <p>Birthday Cakes</p>
            </div>
            <div class="category">
                <img src="anniversary.jpeg" alt="Anniversary Cakes">
                <p>Anniversary Cakes</p>
            </div>
            <div class="category fullwidth">
                <img src="regular2.png" alt="Regular Cakes">
                <p>Regular Cakes</p>
            </div>
        </div>
    </section>

    </div>
    <footer>
        <p>&copy; 2024 Hermosa Bites. All Rights Reserved.</p>
    </footer>

    <script src="index.js"></script>
</body>

</html>
